##############################################################################
# Action composta chamada pelo job "build" de create-rootfs.yml (via
# "uses: ./"). É aqui que o container Void Linux de fato instala as
# ferramentas, clona o profile de build, roda o mkrootfs.sh e organiza
# os arquivos gerados para as etapas seguintes do workflow.
name: "Build rootfs VoidBR"
description: "Builds a tarball rootfs image for VoidBR"

# Parâmetros que quem chama esta action pode/deve passar via "with:".
inputs:
  name:
    description: "Name for the ISO"
    required: true
  edition:
    description: "Edition (base-minimal, base-system, base-voidstrap, base-custom)"
    required: false
    default: "base-custom"
  tmate:
    description: "Enable debugging with tmate"
    required: false
    default: false
  github_token:
    description: "GitHub token for authentication"
    required: true
  message_thread_id:
    description: "Telegram message thread id"
    required: false
  message_thread_id_rootfs:
    description: "Telegram message thread id rootfs"
    required: false

# Valores que esta action expõe para quem a chamou, via "steps.build.outputs.*".
outputs:
  iso_path:
    description: "Path to the generated ISO file"
    value: ${{ steps.build.outputs.iso_path }}
  xz_path:
    description: "Path to the generated TAR.XZ file"
    value: ${{ steps.build.outputs.xz_path }}
  release_name:
    description: "Name of the release"
    value: ${{ steps.prepare-iso.outputs.release_name }}

runs:
  using: "composite"
  steps:
    # Dump de depuração: mostra o evento completo do GitHub que disparou o
    # workflow (útil pra investigar payloads de repository_dispatch) e
    # confirma qual edição/tmate foram recebidos.
    - name: Initial Debug in CONTAINER
      env:
        EVENT_JSON: ${{ toJson(github.event) }}
      shell: bash
      run: |
        source /tmp/send_telegram_message.sh
        replicate
        msg "- name: Initial Debug in CONTAINER"
        echo "Workflow started"
        echo "Event Name: ${{ github.event_name }}"
        echo "Event Action: ${{ github.event.action }}"
        echo "Edition: ${{ github.event.client_payload.edition || inputs.edition }}"
        echo "Tmate from payload: ${{ github.event.client_payload.tmate || inputs.tmate != false && inputs.tmate }}"
        echo "Full github event:"
        printf '%s\n' "$EVENT_JSON"
        replicate

    # Mostra informações básicas do ambiente dentro do container (usuário,
    # host, espaço em disco, montagens) — útil pra depurar problemas de
    # permissão/espaço antes de começar o build de fato.
    - name: Display the current user in CONTAINER
      shell: bash
      run: |
        source /tmp/send_telegram_message.sh
        msg "- name: Display the current user in CONTAINER"
        replicate "#"
        msg_raw "Current host is     : $(hostname)"
        msg_raw "Current user is     : $(whoami)"
        msg_raw "Current user ID is  : $(id -u)"
        msg_raw "Current user details: $(id)"
        msg_raw "Current path        : $(pwd)"
        replicate "#"
        duf -all || true
        replicate "#"
        df -hT || true
        replicate "#"
        ls -la /mnt || true
        replicate "#"

    # Configura os repositórios XBPS (mirrors VoidBR + oficial Fastly +
    # ChiliLinux) e instala, dentro do próprio container, todas as
    # ferramentas necessárias para o mkrootfs.sh rodar (git, curl, zip,
    # ferramentas de partição/filesystem, etc.).
    - name: Install Required Packages and Libraries no CONTAINER
      shell: bash
      run: |
        source /tmp/send_telegram_message.sh
        replicate
        msg "- name: Install Required Packages and Libraries no CONTAINER"
        {
          echo 'repository=https://void.voidbr.org/voidlinux/current'
          echo 'repository=https://void.voidbr.org/voidlinux/extra'
          echo 'repository=https://void.voidbr.org/voidlinux/current/nonfree'
          echo 'repository=https://void.voidbr.org/voidlinux/current/multilib'
          echo
          echo 'repository=https://void.voidbr.org/voidlinux/current/multilib/nonfree'
          echo 'repository=https://repo-fastly.voidlinux.org/current'
          echo 'repository=https://repo-fastly.voidlinux.org/current/nonfree'
          echo 'repository=https://repo-fastly.voidlinux.org/current/multilib'
          echo 'repository=https://repo-fastly.voidlinux.org/current/multilib/nonfree'
          echo
          echo 'repository=https://void.chililinux.com/voidlinux/extra'
          echo
          } > /etc/xbps.d/00-repository-main.conf

          xbps-install -Syu xbps
          xbps-install -yu --ignore-file-conflicts \
            tar \
            xz \
            coreutils \
            dialog \
            gettext \
            curl \
            sed

          #  bash \
          #  xtools \
          #  sudo \
          #  openssh \
          #  tmate \
          #  xz \
          #  zip \
          #  p7zip \
          #  jq \
          #  github-cli \
          #  kmod \
          #  which \
          #  vpm \
          #  libstdc++ \
          #  nano \
          #  curl \
          #  git \
          #  bash \
          #  tree \
          #  duf \
          #  gettext \
          #  rsync \
          #  util-linux \
          #  coreutils \
          #  sed \
          #  grep \
          #  btrfs-progs \
          #  e2fsprogs \
          #  exfatprogs \
          #  dosfstools \
          #  xfsprogs
          vinstall -Scc
          xbps-install -yu ncurses
          replicate

    # Extrai o nome do repositório (ex.: "voidbr-build-rootfs") a partir de
    # $GITHUB_REPOSITORY, usado a seguir para montar os caminhos de trabalho.
    - name: Definir REPO_NAME
      shell: bash
      run: |
        echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

    # Define os dois diretórios principais usados no resto do build:
    # WORK_PATH (workspace do runner) e PROFILE_PATH (onde o
    # chili-void-mklive, com o mkrootfs.sh, vai ser clonado).
    - name: Configurar o ambiente
      shell: bash
      run: |
        WORK_PATH="/__w/${{env.REPO_NAME}}/${{env.REPO_NAME}}"
        PROFILE_PATH="/__w/${{env.REPO_NAME}}/${{env.REPO_NAME}}/chili-void-mklive"
        echo "WORK_PATH=$WORK_PATH"       >> "$GITHUB_ENV"
        echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"

    # Clona o repositório chili-void-mklive (onde vive o mkrootfs.sh e as
    # chaves XBPS) para dentro de PROFILE_PATH — é esse o profile de build
    # compartilhado entre ChiliLinux e VoidBR.
    - name: Checkout chili-void-mklive
      shell: bash
      run: |
        #Checkout chili-void-mklive
        source /tmp/send_telegram_message.sh
        REPO="https://github.com/chililinux/chili-void-mklive"
        msg_raw "Repository: $REPO"

        rm -rf "$PROFILE_PATH" || true
        if ! git clone --depth 1 "$REPO" "$PROFILE_PATH"; then
          echo "Falha ao clonar o repositorio $REPO em $PROFILE_PATH"
          exit 1
        fi
        # ativando 'git config --global --add safe.directory'
        git config --global --add safe.directory "$PROFILE_PATH" || true

        # clean '/__t/' directory
        rm -rf /__t/* || true

    # Abre uma sessão de debug remoto (tmate) dentro do container, só quando
    # o build foi disparado com a opção "tmate" habilitada — permite entrar
    # via SSH pra investigar problemas ao vivo.
    - name: Setup TMATE Session
      uses: mxschmitt/action-tmate@v3
      if: ${{ github.event.client_payload.tmate == true || inputs.tmate == true}}
      with:
        install-dependencies: false
        detached: true

    # A etapa principal: monta os argumentos do mkrootfs.sh (usa "-b
    # $EDITION" quando uma edição específica foi escolhida; "base-custom",
    # o padrão, deixa o mkrootfs.sh usar o SYSPKG padrão dele mesmo), roda o
    # build de fato, e depois localiza/move o tarball .tar.xz gerado para
    # WORK_PATH (a busca por .iso é resíduo de um pipeline irmão que gera
    # ISO completa — aqui sempre fica vazia).
    - name: Build ROOTFS tarball
      shell: bash
      env:
        DEBUG: ${{ inputs.tmate }}
        DISTRONAME: ${{ inputs.name }}
        EDITION: ${{ inputs.edition }}
        MANJAROBRANCH: ${{ inputs.manjaro_branch }}
        COMMUNITYBRANCH: ${{ inputs.community_branch }}
        BIGBRANCH: ${{ inputs.biglinux_branch }}
        SCOPE: ${{ inputs.scope }}
        KERNEL: ${{ inputs.kernel }}
        OFFICE: ${{ inputs.office-chooser }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        # BUILD ISO Image
        # Denine path for directory

        source /tmp/send_telegram_message.sh

        # Check if iso-profiles directory exists before proceeding
        if [[ ! -d "$PROFILE_PATH" ]]; then
          die "ERRO(L427): Diretório $PROFILE_PATH não localizado!"
        fi

        # listando diretório iso-profiles no diretório atual
        msg_run "ls -lah $WORK_PATH"

        # Roda o mkrootfs.sh de fato, dentro de PROFILE_PATH. --automatic
        # evita qualquer prompt interativo (ex.: seleção de mirror); -v deixa
        # a saída verbosa. -b "$EDITION" só é adicionado quando a edição
        # escolhida não é a padrão (base-custom).
        build_mkroot_fs() {
          replicate "######################### RESUMO #################################" 1
          mkrootfs_args=(--automatic -q)
          if [[ -n "$EDITION" && "$EDITION" != "base-custom" ]]; then
            mkrootfs_args+=(-b "$EDITION")
          fi
          msg_raw "BUILD COMMAND            : ./mkrootfs ${mkrootfs_args[*]}"
          msg_raw "PROFILE_PATH             : $PROFILE_PATH"
          replicate "#"
          msg_raw "WORK_PATH                : $WORK_PATH"
          msg_raw "PROFILE_PATH             : $PROFILE_PATH"
          msg_raw "ISO profiles path        : $PROFILE_PATH/$EDITION"
          #replicate "#"
          #msg_raw "ROOT_RUN_DIR             : $(< /root/.config/manjaro-tools/iso-profiles.conf)"
          #msg_raw "BUILDUSER_RUN_DIR        : $(< /home/builduser/.config/manjaro-tools/iso-profiles.conf)"
          replicate "#"

          pushd "$PROFILE_PATH" > /dev/null || true
          #[[ ${{ inputs.tmate }} == 'true' ]] && ./mkrootfs --automatic -q || ./mkrootfs --automatic > /dev/null
          ./mkrootfs "${mkrootfs_args[@]}"
          popd > /dev/null
        }

        # Localiza o arquivo mais recente (.iso e/ou .tar.xz) gerado dentro
        # de PROFILE_PATH e move para WORK_PATH, exportando os nomes via
        # GITHUB_ENV para os steps seguintes consumirem.
        cleanup_and_move_files() {
          OUTPUT_ISO_PATH_NAME=$(find "$PROFILE_PATH" -type f -name "*.iso" -exec stat -c '%Y %n' {} + | sort -nr | awk 'NR==1 {print $2}')
          OUTPUT_XZ_PATH_NAME=$(find "$PROFILE_PATH" -type f -name "*.tar.xz" -exec stat -c '%Y %n' {} + | sort -nr | awk 'NR==1 {print $2}')
          ISO_BASENAME=$(basename "$OUTPUT_ISO_PATH_NAME")
          XZ_BASENAME=$(basename "$OUTPUT_XZ_PATH_NAME")

          echo "OUTPUT_ISO_PATH_NAME=$OUTPUT_ISO_PATH_NAME" >> "$GITHUB_ENV"  # Exporta OUTPUT_ISO_PATH_NAME para outras etapas
          echo "OUTPUT_XZ_PATH_NAME=$OUTPUT_XZ_PATH_NAME" >> "$GITHUB_ENV"    # Exporta OUTPUT_ISO_PATH_NAME para outras etapas
          echo "ISO_BASENAME=$ISO_BASENAME" >> "$GITHUB_ENV"                  # Exporta OUTPUT_ISO_PATH_NAME para outras etapas
          echo "XZ_BASENAME=$XZ_BASENAME" >> "$GITHUB_ENV"                    # Exporta OUTPUT_ISO_PATH_NAME para outras etapas

          if [[ -n "$OUTPUT_ISO_PATH_NAME" ]]; then
            mv -fv "$OUTPUT_ISO_PATH_NAME" "$WORK_PATH/" || echo "ERRO: Falha ao mover arquivo ISO $OUTPUT_ISO_PATH_NAME"
            echo "ISO_FULLNAME=$WORK_PATH/$ISO_BASENAME" >> "$GITHUB_ENV"
          fi
          if [[ -n "$OUTPUT_XZ_PATH_NAME"  ]]; then
            mv -fv "$OUTPUT_XZ_PATH_NAME" "$WORK_PATH/"  || echo "ERRO: Falha ao mover arquivo XZ $OUTPUT_XZ_PATH_NAME"
            echo "XZ_FULLNAME=$WORK_PATH/$XZ_BASENAME" >> "$GITHUB_ENV"
          fi
        }

        build_mkroot_fs
        cleanup_and_move_files

    # Calcula XZ_TAG_NAME a partir da data embutida no nome do tarball (uso
    # histórico; hoje a tag real da release em create-rootfs.yml é baseada
    # em github.run_id, não nesta variável).
    - name: Extrair data do nome do arquivo .tar.xz e definir tag_name
      id: set-tag-name
      shell: bash
      run: |
        FILENAME="$XZ_BASENAME"
        TAG_NAME=$(echo "$FILENAME" | grep -oP '\d{8}')-$(date +%H%M)
        echo "XZ_TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

    # Publica os outputs desta action (iso_path/xz_path) para quem a chamou
    # poder consumir via steps.build.outputs.*.
    - name: Set ISO path
      shell: bash
      run: |
        # Set outputs
        echo "iso_path=$WORK_PATH/$ISO_BASENAME" >> "$GITHUB_OUTPUT"
        echo "xz_path=$WORK_PATH/$XZ_BASENAME" >> "$GITHUB_OUTPUT"
