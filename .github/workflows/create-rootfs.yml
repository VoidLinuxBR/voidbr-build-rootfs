name: Build ROOTFS VoidBR

# Gatilhos que disparam este workflow:
# - push na branch main
# - repository_dispatch vindo de outro repo/workflow (eventos "ISO-*")
# - disparo manual pela interface do GitHub Actions (workflow_dispatch)
# - agendado, todo dia às 07:00 UTC (cron)
on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - "ISO-*"
  workflow_dispatch:
    inputs:
      name:
        type: string
        description: "Name for the ROOTFS"
        required: true
        default: "voidbr"
      edition:
        type: choice
        description: "Edition"
        options:
          - base-minimal
          - base-system
          - base-voidstrap
          - base-custom
        default: "base-custom"
      tmate:
        type: boolean
        description: "Enable debugging with tmate"
        required: false
        default: false

  schedule:
    - cron: "0 7 * * *"

# Variáveis de ambiente disponíveis em todos os jobs/steps deste workflow.
# Inclui credenciais do Telegram/GitHub (vindas de secrets) e metadados do
# build (edição, nome do rootfs, links do próprio workflow) resolvidos a
# partir do disparo manual (inputs) ou do repository_dispatch (client_payload).
env:
  TELEGRAM_TOKEN: "${{ secrets.TOKEN_BOT }}"
  TELEGRAM_VOIDBR_ROOTFS_TOKEN_BOT: "${{ secrets.VOIDBR_ROOTFS_TOKEN_BOT }}"
  GITHUB_TOKEN: "${{ secrets.ORGANIZATION_TOKEN }}"
  CHAT_ID: "${{ secrets.CHAT_ID }}"
  MESSAGE_THREAD_ID: "${{ secrets.MESSAGE_THREAD_ID }}"
  MESSAGE_THREAD_ID_ROOTFS: "${{ secrets.MESSAGE_THREAD_ID_ROOTFS }}"
  started_by_user: "${{ github.actor }}"
  triggered_by_user: "${{ github.triggering_actor }}"
  DEBUG: "${{ github.event.client_payload.tmate || inputs.tmate || false }}"
  tmate: "${{ github.event.client_payload.tmate || inputs.tmate || false }}"
  iso_distroname: "${{ github.event.client_payload.distroname || inputs.distroname || 'voidBR' }}"
  edition: "${{ github.event.client_payload.edition || inputs.edition || 'base-custom' }}"
  rootfs_name: "void-x86_64-${{ github.event.client_payload.edition || inputs.edition || 'base-custom' }}-current.tar.xz"
  wf_url: "https://github.com/${{ github.repository }}/blob/main/.github/workflows/create-rootfs.yml"
  wf_file: "create-rootfs.yml"

jobs:
  # Job preparatório: roda num runner Ubuntu comum (fora do container Void).
  # Calcula horários de referência, monta o script auxiliar de notificação
  # do Telegram (funções de log/mensagem compartilhadas) e o disponibiliza
  # como artifact para o job "build" consumir depois.
  setup:
    runs-on: ubuntu-latest
    outputs:
      time: ${{ steps.time.outputs.time }} # Saída do job
      REPOSITORY_NAME: ${{ steps.get-repo-name.outputs.repo_name }}
    steps:
      # Gera o timestamp (YYYY.MM.DD-HHMM) usado depois no nome/corpo da release.
      - name: Obter a hora atual
        id: time
        shell: bash
        run: |
          #Obter a hora atual
          echo "time=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      # Registra o horário de início do workflow como um todo (data completa
      # e timestamp em segundos), usado depois para calcular a duração total.
      - name: Capturar hora de início do workflow
        id: start-time
        shell: bash
        run: |
          START_TIME=$(date +"%Y-%m-%d %H:%M:%S")  # Hora completa
          START_TIMESTAMP=$(date +%s)  # Timestamp em segundos
          echo "Início do Workflow: $START_TIME"
          echo "START_TIME=$START_TIME"             >> $GITHUB_ENV
          echo "START_TIMESTAMP=$START_TIMESTAMP"   >> $GITHUB_ENV
          echo "START_TIME='$START_TIME'"           >> shared_file.txt
          echo "START_TIMESTAMP='$START_TIMESTAMP'" >> shared_file.txt

      # Monta, em /tmp/send_telegram_message.sh, um script bash com funções
      # reutilizáveis (cores no terminal, helpers de log como msg/msg_ok/die,
      # e as funções send_telegram_msg/tg_notify que fazem o
      # POST de fato para a API do Telegram). Esse arquivo é depois subido
      # como artifact e "source"ado em vários steps/jobs seguintes.
      - name: Create Global Helpers Script - Definir a função send_telegram_message no script temporário
        shell: bash
        env:
          TELEGRAM_TOKEN: "${{ inputs.telegram_token }}"
          TELEGRAM_CHAT_ID: "${{ inputs.telegram_chat_id }}"
          TELEGRAM_VOIDBR_ROOTFS_TOKEN_BOT: "${{ inputs.voidbr_rootfs_token_bot }}"
          TELEGRAM_MESSAGE_THREAD_ID_ROOTFS: "${{ inputs.telegram_message_thread_id_rootfs }}"
        run: |
          #Definir a função send_telegram_message no script temporário
          sudo rm -rf /tmp/send_telegram_message.sh  # Remove se for diretório
          cat << 'EOF' > /tmp/send_telegram_message.sh
          export TERM=${TERM:-xterm}
          export TERM=${TERM:-xterm-256color}

          #Definindo variáveis de cores
          export reset="\033[0m"
          export rst="\033[0m"
          export green="\033[01;32m"
          export red="\033[01;31m"
          export blue="\033[01;34m"
          export cyan="\033[01;36m"
          export pink="\033[01;35m"
          export yellow="\033[01;33m"
          alias ls='ls -lha --color=auto'
          alias dir='ls -lha --color=auto'

          # die: imprime a mensagem de erro (sem tags HTML) e aborta o step atual.
          die() {
            local msg="$1"
            msg="$(sed 's/<[^>]*>//g' <<< "$msg")" # Remove as tags HTML
            echo -e "BP=>${cyan}error: ${red}${msg}${reset}"
            exit  1
          }
          export -f die

          # msg: imprime uma mensagem de "executando" no log.
          msg() {
            local msg="$1"
            msg="$(sed 's/<[^>]*>//g' <<< "$msg")" # Remove as tags HTML
            echo -e "BIV=>${cyan}running: ${yellow}${msg}${reset}"
          }

          # msg_tab: imprime uma mensagem de "info" indentada.
          msg_tab() {
            local msg="$1"
            msg="$(sed 's/<[^>]*>//g' <<< "$msg")" # Remove as tags HTML
            echo -e "BIV=>${yellow}info   : ${cyan}${msg}${reset}"
          }

          # msg_raw: imprime "chave: valor" colorido (se houver ':' na mensagem,
          # colore a parte antes e depois dele separadamente).
          msg_raw() {
            local msg="$1"
            # Remove tags HTML, se existirem
            #msg="$(sed 's/<[^>]*>//g' <<< "$msg")"

            # Verifica se existe ':' na mensagem
            if [[ "$msg" == *:* ]]; then
              # Divide a string antes e depois do primeiro ':'
              local before_colon="${msg%%:*}:"
              local after_colon="${msg#*: }"
              # Aplica as cores
              msg="${cyan}${before_colon} ${yellow}${after_colon}${reset}"
            else
              # Se não houver ':', aplica apenas a cor padrão
              msg="${cyan}${msg}${reset}"
            fi
            echo -e "$msg"
          }
          export -f msg_raw

          # msg_ok: imprime uma mensagem de sucesso/"feito".
          msg_ok() {
            local msg="$1"
            msg="$(sed 's/<[^>]*>//g' <<< "$msg")" # Remove as tags HTML
            echo -e "BP=>${cyan}feito  : ${green}${msg}${reset}"
          }
          export -f msg_ok

          # msg_run: imprime o comando, executa via eval e reporta sucesso/falha.
          msg_run() {
            local msg="$1"
            echo -e "BP=>${cyan}running: ${yellow}${msg}${reset}"

            # Executa o comando e captura o código de saída
            if ! eval "$msg"; then
              echo -e "BP=>${red}Erro ao executar: ${yellow}${msg}${reset}" >&2
              return 1
            fi
            return 0
          }
          export -f msg_run

          # msg_info: variante de mensagem informativa (mesmo formato de msg_tab).
          msg_info() {
            local msg="$1"
            msg="$(sed 's/<[^>]*>//g' <<< "$msg")" # Remove as tags HTML
            echo -e "BIV=>${yellow}info   : ${cyan}${msg}${reset}"
          }

          # msg_warning: imprime uma mensagem de aviso.
          msg_warning() {
            local msg="$1"
            msg="$(sed 's/<[^>]*>//g' <<< "$msg")" # Remove as tags HTML
            echo -e "BIV=>${red}warning: ${orange}${msg}${reset}"
          }

          # replicate: imprime uma linha separadora (repete um caractere até
          # preencher a largura do terminal, ou o tamanho informado).
          replicate() {
            local char=${1:-'#'}
            local nsize=${2:-$(tput cols)}
            local line
            #printf -v line "%*s" "$nsize" && echo "${line// /$char}"
            #printf -v line "%*s" "$nsize" && echo -e "\033[31m${line// /$char}\033[0m"
            printf -v line "%*s" "$nsize" && echo -e "${blue}${line// /$char}${reset}"
          }
          export -f replicate

          # destino das notificacoes deste workflow
          TG_TOKEN=$TELEGRAM_VOIDBR_ROOTFS_TOKEN_BOT
          TG_CHAT=$CHAT_ID
          TG_THREAD=$MESSAGE_THREAD_ID_ROOTFS
          TG_TOTAL=2

          # titulo: "rootfs base-custom"
          tg_title() { printf 'rootfs %s' "$(html_escape "$edition")"; }

          # linha 3: kernel e total de pacotes (so existem depois do build);
          # REAL_KERNEL=na quando a rootfs nao tem o pacote linux
          tg_line3() {
            if [[ -z $REAL_KERNEL ]]; then
              printf '🐧 kernel e pacotes: aguardando o build'
            elif [[ $REAL_KERNEL == na ]]; then
              printf '🐧 sem kernel · 🗃 %s pacotes' "${TOTAL_PACKAGES:-?}"
            else
              printf '🐧 kernel %s · 🗃 %s pacotes' "$(html_escape "$REAL_KERNEL")" "${TOTAL_PACKAGES:-?}"
            fi
          }

          # ----------------------------------------------------------------
          # Notificacoes Telegram - molde unico de 5 linhas (igual ao
          # voidbr-build-package). Antes de usar defina TG_TOKEN, TG_CHAT,
          # TG_THREAD, TG_TOTAL (total de etapas) e tg_title/tg_line3.
          # ----------------------------------------------------------------

          # escapa &, < e > para o parse_mode=HTML do Telegram
          html_escape() {
            local s=$1
            # replacement entre aspas: no bash 5.2+ um & solto vira o texto casado
            s=${s//&/"&amp;"} s=${s//</"&lt;"} s=${s//>/"&gt;"}
            printf '%s' "$s"
          }

          # tempo decorrido desde o timestamp $1 (padrao: inicio do workflow, TG_START_TS)
          fmt_duration() {
            local t0=${1:-$TG_START_TS}
            [[ -n $t0 ]] || { printf '?'; return; }
            local s=$(( $(date +%s) - t0 ))
            if (( s >= 3600 )); then
              printf '%dh %02dm' $((s / 3600)) $((s % 3600 / 60))
            elif (( s >= 60 )); then
              printf '%dm %02ds' $((s / 60)) $((s % 60))
            else
              printf '%ds' "$s"
            fi
          }

          # tamanho legivel de um arquivo
          fmt_size() {
            [[ -f $1 ]] || { printf '?'; return; }
            numfmt --to=iec-i --suffix=B "$(stat -c %s "$1")" 2>/dev/null \
              || du -h "$1" | cut -f1
          }

          # "👤 usuario · ⚙️ evento" (agendado nao tem usuario)
          tg_origin() {
            local user=${started_by_user:-$GITHUB_ACTOR}
            case $GITHUB_EVENT_NAME in
              schedule)            printf '⏰ agendado · ⚙️ cron' ;;
              push)                printf '👤 <a href="https://github.com/%s">%s</a> · ⚙️ push' "$user" "$(html_escape "$user")" ;;
              workflow_dispatch)   printf '👤 <a href="https://github.com/%s">%s</a> · ⚙️ manual' "$user" "$(html_escape "$user")" ;;
              repository_dispatch) printf '👤 <a href="https://github.com/%s">%s</a> · ⚙️ dispatch' "$user" "$(html_escape "$user")" ;;
              *)                   printf '👤 <a href="https://github.com/%s">%s</a> · ⚙️ %s' "$user" "$(html_escape "$user")" "$GITHUB_EVENT_NAME" ;;
            esac
          }

          # send_telegram_msg <html> [botoes extras: ,{"text":..,"url":..}]
          send_telegram_msg() {
            local MESSAGE=$1 extra=$2
            local run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            local markup="{\"inline_keyboard\":[[{\"text\":\"🔗 Job #${GITHUB_RUN_NUMBER}\",\"url\":\"${run_url}\"}${extra}]]}"

            echo -e "${green}$(sed 's/<[^>]*>//g' <<< "$MESSAGE")${reset}"
            [[ -n $TG_TOKEN && -n $TG_CHAT ]] || return 0
            curl -s -o /dev/null -w "telegram: %{http_code}\n" \
              -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="$TG_CHAT" \
              ${TG_THREAD:+-d message_thread_id="$TG_THREAD"} \
              --data-urlencode text="$MESSAGE" \
              --data-urlencode reply_markup="$markup" \
              -d link_preview_options='{"is_disabled":true}' \
              -d parse_mode="HTML" || true
          }

          # tg_notify <icone> <etapa> <status> <linha4> [botoes extras]
          #   <icone> <titulo> · n/N · <status>
          #   👤 usuario · ⚙️ evento
          #   <linha 3 do workflow (tg_line3)>
          #   <linha 4: artefato ou ⚠️ motivo>
          #   🕒 inicio · ⏱ duracao [· 🐞 tmate]
          tg_notify() {
            local icon=$1 step=$2 status=$3 line4=$4 extra=$5
            local time_line="🕒 ${TG_START_TIME} · ⏱ $(fmt_duration)"
            [[ $DEBUG == true ]] && time_line+=" · 🐞 tmate"
            send_telegram_msg "${icon} <b>$(tg_title)</b> · <code>${step}/${TG_TOTAL}</code> · ${status}
          $(tg_origin)
          $(tg_line3)
          ${line4}
          ${time_line}" "$extra"
          }
          EOF
          chmod +x /tmp/send_telegram_message.sh

          # inicio do workflow (fixo -04, nao depende de tzdata) gravado no
          # proprio script, para valer tambem no job build (container)
          {
            echo "export TG_START_TIME='$(TZ='<-04>4' date +'%d/%m/%Y %H:%M')'"
            echo "export TG_START_TS='$(date +%s)'"
          } >> /tmp/send_telegram_message.sh

      # Avisa no Telegram que o workflow começou a rodar (mensagem "step 1/2").
      - name: Enviar notificação inicial para o Telegram
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          msg "- name: Enviar notificação inicial para o Telegram"
          tg_notify "🚀" 1 "Construindo" "📦 aguardando o mkrootfs"

      # Instala no runner Ubuntu (host) ferramentas usadas pelos steps
      # seguintes que ainda rodam fora do container Void (duf, tree, etc.).
      - name: Install dependencies in HOST
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          replicate
          msg "-name: Install dependencies in HOST"
          #sudo apt-get update
          #sudo apt-get autoremove
          #sudo apt-get install -y inetutils-tools duf tree tmate
          sudo apt-get install -y inetutils-tools duf tree
          replicate

      #      - name: Setup TMATE Session in HOST
      #        uses: mxschmitt/action-tmate@v3
      #        shell: bash
      #        with:
      #          install-dependencies: false
      #          detached: true

      # Só registra a versão do kernel do runner Ubuntu (host), pra referência
      # nos logs/notificações — não é o kernel que vai dentro da rootfs.
      - name: Pegar Versão do Kernel do Host (ubuntu)
        shell: bash
        run: |
          KVER=$(uname -a)
          echo "KERNEL_HOST=${KVER}" >> $GITHUB_ENV

      # Cria no host os diretórios que serão montados como volumes dentro do
      # container Void no job "build" — servem de cache persistente entre
      # execuções (evita rebaixar tudo do zero a cada run).
      - name: Set up volume directory in HOST
        shell: bash
        run: |
          #Set up volume directory in HOST
          sudo mkdir -p /mnt/var_lib_manjaro_tools_buildiso
          sudo mkdir -p /mnt/var_cache_manjaro_tools_iso
          sudo mkdir -p /mnt/lfs

      # Disponibiliza o script de funções de notificação (gerado acima) como
      # artifact, para o job "build" baixar (jobs diferentes não compartilham
      # sistema de arquivos automaticamente).
      - name: Upload script as artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-script
          path: /tmp/send_telegram_message.sh

      # Sobe o shared_file.txt (horário de início) como artifact.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-file
          path: shared_file.txt

  # Job principal: roda dentro de um container Void Linux (--privileged, pois
  # o mkrootfs precisa de chroot/bind-mount/binfmt_misc). Aqui de fato a
  # rootfs é construída, empacotada, publicada como release no GitHub, e o
  # resultado é notificado no Telegram.
  build:
    name: Build void-x86_64-${{ github.event.client_payload.edition || 'base-custom' }}
    runs-on: ubuntu-latest
    needs: [setup]
    container:
      #image: vcatafesta/voidlinux-docker:1.5
      image: vcatafesta/voidlinux:1.5 # seg 23 fev 2026 11:55:31 -04
      options: --privileged
      volumes:
        - /mnt/var_lib_manjaro_tools_buildiso:/var/lib/manjaro-tools/buildiso
        - /mnt/var_cache_manjaro_tools_iso:/var/cache/manjaro-tools/iso
        - /mnt/lfs:/mnt/lfs

    steps:
      # Traz de volta, dentro do container, o script de funções de
      # notificação gerado no job "setup".
      - name: Download Telegram Script
        uses: actions/download-artifact@v4
        with:
          name: telegram-script
          path: /tmp/ # O download-artifact vai colocar o arquivo em /tmp/send_telegram_message.sh dentro do container

      # Baixa de volta o shared_file.txt (hoje não é lido por nenhum step).
      - name: Download artifact shared-file
        uses: actions/download-artifact@v4
        with:
          name: shared-file

      # Marca o horário de início específico deste job "build" — usado depois
      # para calcular a duração exibida na notificação final do Telegram.
      - name: Capturar hora de início real
        run: |
          echo "S_TIME_HUMAN=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "S_TIMESTAMP=$(date +%s)" >> $GITHUB_ENV

      # Faz checkout deste próprio repositório (onde estão o action.yml e o
      # mkrootfs.sh que serão usados no step seguinte).
      - name: Checkout repository (voidbr-build-rootfs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Chama a action composta local (action.yml) que efetivamente builda a
      # rootfs — clona o chili-void-mklive, instala pacotes, roda o
      # mkrootfs.sh e move o tarball resultante para $WORK_PATH.
      - name: Build ROOTFS Void
        uses: ./
        id: build
        with:
          name: ${{ github.event.client_payload.name || inputs.name }}
          edition: ${{ env.edition }}
          tmate: ${{ github.event.client_payload.tmate || 'false' }}
          github_token: ${{ secrets.ORGANIZATION_TOKEN }}
          message_thread_id_rootfs: ${{ secrets.MESSAGE_THREAD_ID_ROOTFS }}

      # Consulta o banco do xbps dentro da rootfs recém-gerada para extrair:
      # a lista de pacotes instalados, a contagem total, a versão do kernel
      # linux empacotado, e a versão do kernel do próprio container — tudo
      # usado depois na release e na notificação final.
      - name: Capturar dados da tarball rootfs gerado
        run: |
          # O rootfs é construído dentro da pasta da edição (ex: base-custom)
          #TARGET_ROOT="${{ env.WORK_PATH }}/${{ env.edition }}"
          TARGET_ROOT="${{ env.PROFILE_PATH }}/${{ env.edition }}"
          # lista de pacotes com o mesmo nome/versao do tarball
          PKG_LIST_NAME="${XZ_BASENAME%.tar.xz}.packages.txt"

          # Gera a lista de pacotes
          xbps-query -r "$TARGET_ROOT" -l | awk '{print $2}' > "${{ env.WORK_PATH }}/$PKG_LIST_NAME"

          # Exporta o nome do arquivo para usar no link do Telegram
          echo "PKG_LIST_FILE=$PKG_LIST_NAME" >> $GITHUB_ENV

          # 1. Contar Pacotes do ROOTFS real
          PKG_COUNT=$(xbps-query -r "$TARGET_ROOT" -l 2>/dev/null | wc -l || echo "0")
          echo "TOTAL_PACKAGES=${PKG_COUNT}" >> $GITHUB_ENV

          # 2. Pega a versão do pacote linux instalado no rootfs real
          K_VER=$(xbps-query -r "$TARGET_ROOT" -p version linux 2>/dev/null || echo "na")
          echo "REAL_KERNEL=${K_VER}" >> $GITHUB_ENV

          # 3. Pega o kernel do container
          K_CONTAINER=$(uname -a)
          echo "CONTAINER_KERNEL=${K_CONTAINER}" >> $GITHUB_ENV

      # Calcula o hash MD5 do tarball gerado, usado para conferência de
      # integridade por quem for baixar o release.
      - name: Calculate MD5 Hash
        shell: bash
        run: |
          pushd "${{ env.WORK_PATH }}"
          md5sum "${{ env.XZ_BASENAME }}" > "${{ env.XZ_BASENAME }}.md5"
          # Captura o hash e salva no GITHUB_ENV para uso posterior
          echo "MD5_VAL=$(cut -d' ' -f1 "${{ env.XZ_BASENAME }}.md5")" >> $GITHUB_ENV
          popd

      # Empacota tarball + md5 + lista de pacotes num .zip (sem compressão,
      # "--store", já que o .tar.xz já vem comprimido) — o limite "-s 2000m"
      # existe por causa do tamanho máximo de asset do GitHub Releases.
      - name: Prepare ZIP file for release
        id: prepare-iso
        shell: bash
        run: |
          #Prepare ZIP file for release
          source /tmp/send_telegram_message.sh
          msg_run "ls -lha $PWD"
          release=${{ env.XZ_BASENAME }} # Apenas obtém o nome do arquivo com extensão
          release="${release%.tar.xz}"
          echo "release_name=${release}" >> $GITHUB_ENV
          if zip \
              --junk-paths \
              --store \
              -s 2000m \
              ${release}.zip \
              ${{ env.XZ_FULLNAME }} \
              ${{ env.XZ_FULLNAME }}.md5 \
              ${{ env.WORK_PATH }}/${{ env.PKG_LIST_FILE }}; then
            echo "ZIP_FULLNAME=${{ env.WORK_PATH }}/${release}.zip" >> "$GITHUB_ENV"
            echo "ZIP_BASENAME=${release}.zip"                      >> "$GITHUB_ENV"
            echo "${ZIP_FULLNAME} prepared for release"
            msg_run "ls -lha $PWD"
          else
            die "ERRO: No preparo do arquivo ZIP para release"
          fi

      # Cria a release no GitHub (tag baseada no run_id, sempre única) e sobe
      # o tarball, o .md5 e a lista de pacotes como assets.
      - name: Criar Release e Upload Asset
        id: create_gh_release
        uses: softprops/action-gh-release@v2
        with:
          # tag e titulo com o mesmo nome/versao do tarball
          # (ex: void-x86_64-base-custom-20261104-0408)
          tag_name: ${{ env.release_name }}
          name: ${{ env.release_name }}
          files: |
            ${{ env.XZ_FULLNAME }}
            ${{ env.WORK_PATH }}/${{ env.XZ_BASENAME }}.md5
            ${{ env.WORK_PATH }}/${{ env.PKG_LIST_FILE }}
          body: |
            - **Data e Hora        :** ${{ needs.setup.outputs.time }}
            - **Edição             :** ${{ env.edition }}
            - **Kernel             :** ${{ env.REAL_KERNEL == 'na' && 'sem kernel' || env.REAL_KERNEL }}
            - **Pacotes            :** ${{ env.TOTAL_PACKAGES }}
            - **MD5                :** `${{ env.MD5_VAL }}`
            - **Nome do Repositório:** ${{ env.REPO_NAME }}
            - Auto-generated build
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_TOKEN }}

      # Clona o repositório voidlinuxbr/void-install, substitui o rootfs
      # "current" por este build recém-gerado, e faz commit/push — é assim
      # que o instalador do VoidBR passa a distribuir a rootfs mais nova.
      - name: Atualizar repositório void-install
        id: void_install
        shell: bash
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.ORGANIZATION_TOKEN }}@github.com/voidlinuxbr/void-install.git "${{ env.WORK_PATH }}/void-install"
          cd "${{ env.WORK_PATH }}/void-install"
          cp -fv "${{ env.XZ_FULLNAME }}" void-x86_64-base-custom-current.tar.xz
          cp -fv "${{ env.XZ_FULLNAME }}.md5" void-x86_64-base-custom-current.tar.xz.md5
          sed -i "s/${{ env.XZ_BASENAME }}/void-x86_64-base-custom-current.tar.xz/g" void-x86_64-base-custom-current.tar.xz.md5
          git config --global user.email "vctafesta@gmail.com"
          git config --global user.name "GitHub Actions"
          git add .
          git commit -m "Gerado e adicionado automaticamente pelo Github Actions"
          git push origin main

      # Monta e envia o resumo final para o Telegram (sucesso/falha, duração,
      # espaço em disco, links de download, contagem de pacotes). Roda sempre
      # ("if: always()"), mesmo que alguma etapa anterior tenha falhado, pra
      # garantir que o time seja avisado do resultado de qualquer jeito.
      - name: Enviar notificação final para o Telegram
        if: always()
        shell: bash
        env:
          D_URL: "https://github.com/${{ github.repository }}/releases/download/${{ env.release_name }}/${{ env.XZ_BASENAME }}"
          P_URL: "https://github.com/${{ github.repository }}/releases/download/${{ env.release_name }}/${{ env.PKG_LIST_FILE }}"
          STATUS: ${{ job.status }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RELEASE_OUTCOME: ${{ steps.create_gh_release.outcome }}
          INSTALL_OUTCOME: ${{ steps.void_install.outcome }}
        run: |
          source /tmp/send_telegram_message.sh
          replicate
          msg 'Enviar notificação final para o Telegram'

          if [[ $STATUS == success ]]; then
            name=${XZ_BASENAME%.tar.xz}
            tg_notify "✅" 2 "Publicado" \
              "📦 <code>$(html_escape "$name")</code> · $(fmt_size "$XZ_FULLNAME")" \
              ",{\"text\":\"⬇️ Download\",\"url\":\"${D_URL}\"},{\"text\":\"📄 Pacotes\",\"url\":\"${P_URL}\"}"
          else
            if [[ $BUILD_OUTCOME == failure ]]; then
              motivo="falha no mkrootfs (build da rootfs)"
            elif [[ $RELEASE_OUTCOME == failure ]]; then
              motivo="falha ao criar a release no GitHub"
            elif [[ $INSTALL_OUTCOME == failure ]]; then
              motivo="falha ao atualizar o void-install"
            else
              motivo="falha no workflow (veja o log)"
            fi
            tg_notify "❌" 2 "Falhou" "⚠️ ${motivo}"
          fi
          replicate
